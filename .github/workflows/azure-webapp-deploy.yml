name: Desplegar web en Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # La URL de la API se fija al compilar (Vite)
  VITE_API_URL: https://green-saver-api-e0cjeqdccwg0h9dr.canadacentral-01.azurewebsites.net

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar en Azure (pm2 sirve la carpeta como SPA)
        uses: azure/webapps-deploy@v3
        with:
          app-name: green-saver-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
